[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echotime"
version = "0.17.1"
description = "Explainable structural similarity for time series and time-series datasets."
readme = { file = "PYPI_LONG_DESCRIPTION.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Zipeng Wu", email = "zxw365@student.bham.ac.uk" },
]
keywords = ["time-series", "similarity", "dataset-similarity", "analog-search", "structural-similarity", "agent-tools", "explainable-ai", "irregular-sampling", "event-stream", "longitudinal", "wearable", "clinical", "traffic", "markets"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.22",
  "scipy>=1.8",
]

[project.urls]
Homepage = "https://zipengwu.me/EchoTime/"
Documentation = "https://zipengwu.me/EchoTime/guide/"
Repository = "https://github.com/ZipengWu365/EchoTime"
Issues = "https://github.com/ZipengWu365/EchoTime/issues"

[project.optional-dependencies]
io = ["pandas>=2.0"]
parquet = ["pandas>=2.0", "pyarrow>=14.0"]
mixed-stack = ["numpy>=1.22,<2.2", "scipy>=1.8,<1.15", "pandas>=2.0,<2.3", "numba>=0.58,<0.62"]
dev = ["pytest>=7.0", "pandas>=2.0"]
docs = ["Markdown==3.9", "matplotlib>=3.7", "pillow>=9.5"]

[project.scripts]
echotime = "echotime.cli:main"
echotime-demo = "echotime.demo_server:main"
tsontology = "tsontology.cli:main"
tsontology-demo = "tsontology.demo_server:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
echotime = ["data/*.csv", "data/knowledge/articles/*.html", "data/knowledge/references/*", "data/knowledge/manifest/*.json", "data/runtime/manifest.json", "data/runtime/examples/data/*", "data/runtime/examples/gallery/*.py", "data/runtime/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
