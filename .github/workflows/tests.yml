name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Build article bundle from current Markdown
        run: |
          python -m pip install Markdown==3.9
          python tools/build_knowledge_pages.py
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run complete test suite
        run: python -m pytest -q

  acceleration-search:
    runs-on: ubuntu-latest
    env:
      ECHOTIME_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install native extension and optional CPU search
        run: python -m pip install -e '.[dev,search]'
      - name: Require the new native cutoff ABI
        run: |
          python - <<'PY'
          from echotime import similarity_backend_info
          from echotime._native import ext
          print(similarity_backend_info())
          assert ext() is not None
          assert ext().CUTOFF_ABI_VERSION == 1
          PY
      - name: Check strict golden and optional candidate engines
        run: python -m pytest -q tests/test_acceleration_golden.py tests/test_cutoff.py tests/test_search_candidates.py tests/test_search_approximate.py tests/test_search.py
      - name: Run public retrieval example
        run: python examples/search_index.py
      - name: Record smoke timings without an uncalibrated speed gate
        run: python benchmarks/run_suite.py --profile smoke --n-jobs 2 --repeats 2 --out benchmark-results/ci-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceleration-smoke
          path: benchmark-results/ci-smoke.*

  package-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -e '.[dev,docs]' build twine
      - name: Build and check current articles
        run: |
          python tools/build_knowledge_pages.py
          python tools/build_knowledge_pages.py --check
      - name: Check bundled runtime resources
        run: python tools/sync_runtime_assets.py --check
      - name: Check complete method-animation coverage and asset hashes
        run: python tools/build_method_animations.py --check
      - name: Check shared-input similarity-lab states and asset hashes
        run: python tools/build_similarity_lab.py --check
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Verify the installed wheel away from the checkout
        run: |
          python -m venv /tmp/echotime-wheel-test
          /tmp/echotime-wheel-test/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/echotime-wheel-test/bin/python - <<'PY'
          import echotime, tsontology
          from echotime.sitebundle import project_pages_bundle
          from echotime.method_animations import animation_catalog
          pages = project_pages_bundle()
          assert "articles/time-series-similarity-guide.en.html" in pages
          assert "articles/what-time-series-similarity-measures.en.html" in pages
          assert "articles/catalog.json" in pages
          assert "references/time-series-similarity-literature.json" in pages
          assert len(animation_catalog()["methods"]) == 137
          assert "assets/method-animations/media/dtw.gif" in pages
          assert "animation-twed" in pages["guide/methods.html"]
          assert "guide/similarity-lab.html" in pages
          assert "assets/similarity-lab/states.json" in pages
          assert pages["assets/similarity-lab/mechanism-comparison.gif"].startswith(b"GIF89a")
          print("Wheel imports, reading pages, animation assets and shared-input lab verified")
          PY
      - name: Verify acceleration APIs from the installed wheel
        env:
          ECHOTIME_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '2'
        run: /tmp/echotime-wheel-test/bin/python tools/verify_acceleration_install.py --expect-installed --expect-backend native --out benchmark-results/ci-wheel-verification.json
