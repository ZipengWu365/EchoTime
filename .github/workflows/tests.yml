name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run complete test suite
        run: python -m pytest -q

  package-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -e '.[dev,docs]' build twine
      - name: Check generated articles
        run: python tools/build_knowledge_pages.py --check
      - name: Check bundled runtime resources
        run: python tools/sync_runtime_assets.py --check
      - name: Check complete method-animation coverage and asset hashes
        run: python tools/build_method_animations.py --check
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Verify the installed wheel away from the checkout
        run: |
          python -m venv /tmp/echotime-wheel-test
          /tmp/echotime-wheel-test/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/echotime-wheel-test/bin/python -c "import echotime, tsontology; from echotime.sitebundle import project_pages_bundle; from echotime.method_animations import animation_catalog; p = project_pages_bundle(); assert 'articles/time-series-similarity-guide.en.html' in p; assert 'references/time-series-similarity-literature.json' in p; assert len(animation_catalog()['methods']) == 137; assert 'assets/method-animations/media/dtw.gif' in p; assert 'animation-twed' in p['guide/methods.html']; print('Wheel imports, reading pages and complete animation assets verified')"
